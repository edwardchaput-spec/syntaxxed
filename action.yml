name: Syntaxxed Context Builder
description: Build focused, redacted repository context for AI coding tools.
author: Edward Chaput de Saintonge

inputs:
  detail:
    description: 'Context detail: outline, logic, source'
    required: false
    default: 'logic'
  intent:
    description: 'Optional task focus used to select relevant files'
    required: false
  out:
    description: 'Output filename'
    required: false
    default: 'syntaxxed-context.md'

outputs:
  output-path:
    description: 'Absolute path to the generated context file'
    value: ${{ steps.build.outputs.output-path }}
  tokens-saved:
    description: 'Estimated number of tokens removed'
    value: ${{ steps.build.outputs.tokens-saved }}
  secrets-redacted:
    description: 'Number of secrets redacted from the payload'
    value: ${{ steps.build.outputs.secrets-redacted }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Build repository context
      id: build
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_DETAIL: ${{ inputs.detail }}
        INPUT_INTENT: ${{ inputs.intent }}
        INPUT_OUT: ${{ inputs.out }}
      run: node "$GITHUB_ACTION_PATH/dist/cli/index.js"

    - name: Upload prepared context
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: syntaxxed-context
        path: ${{ steps.build.outputs.output-path }}
        if-no-files-found: error

branding:
  icon: minimize-2
  color: purple
